[project]
name = "workpilot-api"
version = "0.0.0"
description = "WorkPilot backend: auth, sync, AI and domain API."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
