<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EDF0E8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iPhone and iPad: home screen icon and name (they ignore the manifest's icons). -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="WorkPilot" />
    <title>WorkPilot</title>
    <script>
      // Start in the theme and palette picked on this device, before the app loads: no flash
      // of light colours on a dark screen, nor of another space's colours. The palette is the
      // one of the space in the URL (/work/today), else the last one shown. The app then
      // applies the profile's theme and the space's palette (src/lib/theme.ts).
      ;(function () {
        var theme, palette, palettes
        try {
          theme = localStorage.getItem('workpilot:theme')
          palette = localStorage.getItem('workpilot:palette')
          palettes = JSON.parse(localStorage.getItem('workpilot:palettes') || '{}')
        } catch (error) {}
        var space = location.pathname.split('/')[1]
        var isDark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light'
        document.documentElement.dataset.palette =
          (palettes && palettes[space]) || palette || 'grove'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
