services:
  app:
    build: .
    env_file: .env
    environment:
      WORKPILOT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-workpilot}:${POSTGRES_PASSWORD:-workpilot}@db:5432/${POSTGRES_DB:-workpilot}
    # http://localhost:8100 (WORKPILOT_PORT in .env if 8100 is taken on this computer)
    ports:
      - "${WORKPILOT_PORT:-8100}:8000"
    # Lets the app reach an AI server on this computer (e.g. LM Studio) at host.docker.internal.
    # Built into Docker Desktop; needed on Linux (docs/ai-providers.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql
    # No port on this computer: only the app reaches it, so it can't clash with another
    # Postgres. `make db` opens one for development (docker-compose.dev.yml).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
